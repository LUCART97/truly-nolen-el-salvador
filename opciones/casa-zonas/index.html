<h1>Casa de las 3 zonas · 4 opciones</h1>
<p>Para la sección «¿Dónde revisamos?» de la portada. Mismo estilo que la casa de globaltni.com: interior en rojo, perímetro en amarillo y jardín en verde, cada una con un paisaje de El Salvador. Diga qué número prefiere.</p>
