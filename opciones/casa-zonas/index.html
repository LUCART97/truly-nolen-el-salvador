<style>
:root{--ink:#010007;--muted:#5e5e5e;--yellow:#ffd800;--paper:#f6f6f3}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,Arial,sans-serif}
header{padding:40px 24px 8px;max-width:1240px;margin:0 auto}h1{font-size:clamp(28px,4vw,44px);margin:0 0 10px;letter-spacing:-.02em}
header p{color:var(--muted);font-size:17px;line-height:1.6;margin:0;max-width:70ch}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;padding:28px 24px 60px;max-width:1240px;margin:0 auto}
figure{margin:0;background:#fff;border:1px solid #dedede;border-radius:6px;overflow:hidden}
figure img{width:100%;height:auto;display:block}
figcaption{padding:16px 18px 20px}figcaption b{display:inline-block;background:var(--yellow);padding:4px 10px;border-radius:3px;margin-right:8px}
figcaption span{display:block;margin-top:10px;color:var(--muted);font-size:15px;line-height:1.5}
@media(max-width:760px){main{grid-template-columns:1fr}}
</style>

<body>
<header>
<h1>Casa de las 3 zonas · 10 opciones</h1>
<p>Para la sección «¿Dónde revisamos?» de la portada. Mismo estilo que la casa de globaltni.com: interior en rojo, perímetro en amarillo y jardín en verde, cada una con un paisaje de El Salvador. Diga qué número prefiere.</p>
</header>
<main>
<figure><img src="opcion-1.webp" alt="Opción 1: Casa moderna en Santa Tecla" loading="lazy"/><figcaption><b>1</b>Casa moderna en Santa Tecla<span>Dos plantas, estuco blanco y madera, cochera y jardín tropical. Al fondo, el volcán de San Salvador al atardecer.</span></figcaption></figure>
<figure><img src="opcion-2.webp" alt="Opción 2: Casa colonial de Suchitoto" loading="lazy"/><figcaption><b>2</b>Casa colonial de Suchitoto<span>Una planta, teja roja, patio interior con fuente y buganvilias. Al fondo, el lago Suchitlán.</span></figcaption></figure>
<figure><img src="opcion-3.webp" alt="Opción 3: Casa de playa en La Libertad" loading="lazy"/><figcaption><b>3</b>Casa de playa en La Libertad<span>Una planta, terraza de madera, piscina y cocoteros. Al fondo, el Pacífico y los acantilados.</span></figcaption></figure>
<figure><img src="opcion-4.webp" alt="Opción 4: Casa del lago de Coatepeque" loading="lazy"/><figcaption><b>4</b>Casa del lago de Coatepeque<span>Dos plantas de piedra y vidrio, piscina infinita y jardín en terrazas. Al fondo, el lago con su isla y el volcán de Santa Ana.</span></figcaption></figure>
<figure><img src="opcion-5.webp" alt="Opción 5: Casa en residencial de Antiguo Cuscatlán" loading="lazy"/><figcaption><b>5</b>Casa en residencial de Antiguo Cuscatlán<span>Dos plantas, techo plano, cochera y jardín con palmeras. Al fondo, las luces de San Salvador y el volcán.</span></figcaption></figure>
<figure><img src="opcion-6.webp" alt="Opción 6: Casa de finca de café en Apaneca" loading="lazy"/><figcaption><b>6</b>Casa de finca de café en Apaneca<span>Una planta con corredores, columnas de madera y teja, jardín de flores y cafetales. Al fondo, montañas y volcanes de la Ruta de las Flores.</span></figcaption></figure>
<figure><img src="opcion-7.webp" alt="Opción 7: Casa de pueblo en Ataco" loading="lazy"/><figcaption><b>7</b>Casa de pueblo en Ataco<span>Dos plantas con balcones de madera y paredes de color, patio con hamaca. Al fondo, el pueblo de Concepción de Ataco y sus montañas.</span></figcaption></figure>
<figure><img src="opcion-8.webp" alt="Opción 8: Casa minimalista en Santa Elena" loading="lazy"/><figcaption><b>8</b>Casa minimalista en Santa Elena<span>Volúmenes blancos, grandes ventanales y piscina larga junto al jardín. Al fondo, el volcán de San Salvador y la ciudad.</span></figcaption></figure>
<figure><img src="opcion-9.webp" alt="Opción 9: Casa de playa en Costa del Sol" loading="lazy"/><figcaption><b>9</b>Casa de playa en Costa del Sol<span>Una planta con terrazas y hamacas, piscina y cocoteros. Al fondo, el estero, la playa y el Pacífico.</span></figcaption></figure>
<figure><img src="opcion-10.webp" alt="Opción 10: Casa familiar en San Miguel" loading="lazy"/><figcaption><b>10</b>Casa familiar en San Miguel<span>Dos plantas, corredor con arcos y árboles de mango en el jardín. Al fondo, el volcán Chaparrastique.</span></figcaption></figure>
</main>
